<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victor Marcias</title>
  <meta name="description" content="Victor Marcias — LinkedIn, GitHub, CV">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #eef1f5;
      --bg-2: #dfe6ee;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-soft: #6b7280;
      --accent: #34495e;
      --ring: #cbd5e1;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 40px 32px 32px;
      text-align: center;
      box-shadow: 0 20px 60px -20px rgba(15, 23, 42, 0.25);
      opacity: 0;
      transform: translateY(16px);
      animation: card-in 0.6s ease-out forwards;
    }

    @keyframes card-in {
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrap {
      width: 128px;
      height: 128px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--accent), var(--ring));
      opacity: 0;
      transform: scale(0.85);
      animation: pop-in 0.5s 0.15s ease-out forwards;
    }

    @keyframes pop-in {
      to { opacity: 1; transform: scale(1); }
    }

    .avatar,
    .avatar-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid var(--card-bg);
    }

    .avatar-fallback {
      background: linear-gradient(135deg, #34495e, #5d7a99);
      color: #fff;
      font-size: 40px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 4px;
      opacity: 0;
      animation: fade-up 0.5s 0.25s ease-out forwards;
    }

    .tagline {
      font-size: 14px;
      color: var(--text-soft);
      margin: 0 0 28px;
      opacity: 0;
      animation: fade-up 0.5s 0.32s ease-out forwards;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #eef1f5;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      opacity: 0;
      transform: translateY(10px);
      animation: fade-up 0.5s ease-out forwards;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .link:nth-child(1) { animation-delay: 0.4s; }
    .link:nth-child(2) { animation-delay: 0.48s; }
    .link:nth-child(3) { animation-delay: 0.56s; }

    .link:hover, .link:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -12px rgba(15, 23, 42, 0.25);
      border-color: var(--ring);
      background: #ffffff;
    }

    .link:active {
      transform: translateY(0);
    }

    .link svg {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
    }

    .link .arrow {
      margin-left: auto;
      width: 16px;
      height: 16px;
      opacity: 0.35;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .link:hover .arrow {
      transform: translateX(3px);
      opacity: 0.7;
    }

    .link.linkedin svg { color: #0a66c2; }
    .link.github svg { color: #111827; }
    .link.cv svg { color: #2b579a; }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-soft);
      opacity: 0;
      animation: fade-up 0.5s 0.65s ease-out forwards;
    }

    @media (max-width: 400px) {
      .card { padding: 32px 24px 26px; border-radius: 20px; }
      .avatar-wrap { width: 108px; height: 108px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar-wrap">
      <img
        class="avatar"
        src="assets/photo.jpg"
        alt="Victor Marcias"
        onerror="this.replaceWith(Object.assign(document.createElement('div'), {className: 'avatar-fallback', textContent: 'VM'}))"
      >
    </div>

    <h1>Victor Marcias</h1>
    <p class="tagline">Software Developer</p>

    <nav class="links">
      <a class="link linkedin" href="https://www.linkedin.com/in/victor-hugo-marcias" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        <span>LinkedIn</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>

      <a class="link github" href="https://github.com/victormarcias" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.5 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.22-3.37-1.22-.46-1.2-1.11-1.52-1.11-1.52-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.57 2.34 1.11 2.91.85.09-.67.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.74 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.43.2 2.48.1 2.74.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .28.18.6.69.5A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
        <span>GitHub</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>

      <a class="link cv" href="assets/cv.pdf" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 1.5L18.5 9H14a1 1 0 0 1-1-1V3.5zM8 13h2.4l1.1 3.6L12.6 13H15l-2.2 6.5h-1.6L10 15.6l-1.2 3.9H7.2L5 13h2.1l1.1 3.6L9.3 13H8z"/></svg>
        <span>CV</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
    </nav>

    <footer>&copy; <span id="year"></span> Victor Marcias</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
